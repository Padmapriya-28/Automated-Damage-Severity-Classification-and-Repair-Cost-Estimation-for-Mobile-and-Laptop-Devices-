<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Damage Severity and Repair Cost</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-devices" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-a" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-b" aria-hidden="true"></div>
    <header class="project-header">
      <div class="project-title">Damage Severity & Repair Cost Intelligence</div>
    </header>
    <main class="app">
      <section class="panel upload-panel">
        <span class="kicker">Neural Inspection Console</span>
        <h1>Start With a Clear Damage Snapshot</h1>
        <p>Upload a mobile or laptop photo to begin precision severity and cost analysis.</p>
        <form id="upload-form">
          <label for="device-type">Device Type</label>
          <select id="device-type" required>
            <option value="" selected disabled>Select device category</option>
            <option value="phone">Phone</option>
            <option value="laptop">Laptop</option>
          </select>
          <label>Damage Image</label>
          <div class="image-source-actions">
            <button type="button" id="take-photo-btn">Take Photo</button>
            <button type="button" id="upload-photo-btn">Upload Photo</button>
          </div>
          <input type="file" id="camera-input" accept="image/*" capture="environment" />
          <input type="file" id="gallery-input" accept="image/*" />
          <label for="shop-quote-amount">Shop Quoted Repair Cost (Optional)</label>
          <input
            type="number"
            id="shop-quote-amount"
            min="0"
            step="0.01"
            placeholder="Enter quoted amount from shop owner"
          />
          <label for="shop-quote-currency">Quoted Currency</label>
          <select id="shop-quote-currency">
            <option value="">Auto (Based on your region)</option>
            <option value="USD">USD</option>
            <option value="INR">INR</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="AED">AED</option>
            <option value="JPY">JPY</option>
          </select>
          <label for="shop-quote-details">Shop Details (Optional)</label>
          <textarea
            id="shop-quote-details"
            rows="3"
            placeholder="Example: Screen replacement + frame alignment + labor"
          ></textarea>
          <button type="submit">Continue to Prediction</button>
        </form>
        <div class="status" id="status"></div>
      </section>
    </main>
    <script src="/static/upload.js"></script>
  </body>
</html>
