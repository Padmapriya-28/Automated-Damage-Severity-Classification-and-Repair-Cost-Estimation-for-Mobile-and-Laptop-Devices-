<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prediction Result | Damage Severity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-devices" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-a" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-b" aria-hidden="true"></div>
    <header class="project-header">
      <div class="project-title">Damage Severity & Repair Cost Intelligence</div>
    </header>
    <main class="app">
      <section class="panel results-panel">
        <span class="kicker">Neural Inspection Console</span>
        <h1>Precision AI Damage Intelligence for Faster Repair Decisions</h1>
        <div class="status" id="status">Preparing analysis...</div>

        <div class="results">
          <div class="image-preview">
            <h2>Uploaded Image</h2>
            <img id="preview" alt="Uploaded preview" />
          </div>
          <div class="result-card">
            <h2>Prediction</h2>
            <div id="prediction"></div>
            <h2>Grad-CAM Heatmap</h2>
            <img id="heatmap" alt="Grad-CAM heatmap" />
          </div>
        </div>

        <div class="actions">
          <button id="download-report-btn" class="ghost-btn" type="button" disabled>
            Download PDF Report
          </button>
          <a class="ghost-btn" href="/">Analyze Another Image</a>
        </div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
